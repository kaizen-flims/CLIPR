name: CLIPR Android CI & Release Build

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Unpack and Commit CLIPR Source Tree if Missing
        run: |
          if [ ! -f "app/build.gradle.kts" ]; then
            pip install --quiet gdown
            gdown 1XxSLjxhxvQjXtElstJyEPusruYMK12NB -O /tmp/clipr.zip
            unzip -o /tmp/clipr.zip -d .
            git config user.name "kaizen-flims"
            git config user.email "premdas7809@gmail.com"
            git add -A
            git commit -m "feat: complete CLIPR v1.0.0 Android application (Phases 1-8)"
            git push origin HEAD:main
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Generate Release Keystore
        run: |
          keytool -genkeypair -v \
            -keystore /tmp/clipr-release.jks \
            -alias clipr_release \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass clipr_release_pass \
            -keypass clipr_release_pass \
            -dname "CN=CLIPR, OU=Mobile, O=KaizenFilms, L=Birpara, S=WB, C=IN"
          echo "CLIPR_RELEASE_KEYSTORE_PATH=/tmp/clipr-release.jks" >> $GITHUB_ENV
          echo "CLIPR_RELEASE_STORE_PASSWORD=clipr_release_pass" >> $GITHUB_ENV
          echo "CLIPR_RELEASE_KEY_ALIAS=clipr_release" >> $GITHUB_ENV
          echo "CLIPR_RELEASE_KEY_PASSWORD=clipr_release_pass" >> $GITHUB_ENV

      - name: Run Unit Tests and Assemble APKs
        run: gradle testDebugUnitTest assembleDebug assembleRelease --stacktrace

      - name: Upload CLIPR Release APK
        uses: actions/upload-artifact@v4
        with:
          name: CLIPR-v1.0.0-Release-APK
          path: app/build/outputs/apk/release/*.apk

      - name: Upload CLIPR Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: CLIPR-v1.0.0-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
